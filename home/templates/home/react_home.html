<!DOCTYPE html>
<html lang="en">
<head>
  {% load static %}
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="{% if use_vite_dev %}/logo.png{% else %}{% static 'logo.png' %}{% endif %}" />
  <title>TANE Konsumidores</title>
  {% if use_vite_dev %}
    <script type="module" src="{{ vite_url }}/@vite/client"></script>
  {% elif main_css %}
    {% for css_file in main_css %}
      <link rel="stylesheet" href="{% static css_file %}" />
    {% endfor %}
  {% endif %}
</head>
<body>
  <div id="root"></div>
  <script>
    window.__VITE_DEV__ = {{ use_vite_dev|yesno:"true,false" }};
    window.__STATIC_BASE__ = "{% static '' %}";
  </script>
  {% if use_vite_dev %}
    <script type="module" src="{{ vite_url }}/src/main.jsx"></script>
  {% elif main_js %}
    <script type="module" src="{% static main_js %}"></script>
  {% else %}
    <p style="font-family: Arial, Helvetica, sans-serif; padding: 16px;">
      Frontend build files not found. Run <strong>npm run build</strong> inside <strong>frontend</strong>
      or start Vite with <strong>npm run dev</strong>.
    </p>
  {% endif %}
</body>
</html>
