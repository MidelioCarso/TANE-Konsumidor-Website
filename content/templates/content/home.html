<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ organization_name }}</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f8fafc;
            color: #1f2937;
        }
        .hero {
            max-width: 900px;
            margin: 80px auto;
            background: #ffffff;
            border-radius: 12px;
            padding: 36px;
            box-shadow: 0 1px 8px rgba(15, 23, 42, 0.1);
        }
        h1 {
            margin: 0 0 12px;
            font-size: 2rem;
        }
        p {
            margin: 0;
            line-height: 1.6;
        }
        .subtitle {
            margin-top: 10px;
            color: #334155;
        }
    </style>
</head>
<body>
    <section class="hero">
        <h1>{{ hero_title }}</h1>
        <p>{{ mission_statement }}</p>
        {% if hero_subtitle %}
            <p class="subtitle">{{ hero_subtitle }}</p>
        {% endif %}
    </section>
</body>
</html>
